<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stormblade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    width: 100%;
    height: 100%;
    margin: 0; 
    padding: 0; 
    background-color: #1a1a1a; 
    font-family: Arial, sans-serif; 
    overflow: hidden; 
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  canvas { 
    width: 100vw;
    height: 100vh;
    background-color: #3b5e2b;
    display: block;
  }
  .modal-shop { 
    display: none; 
    position: absolute; 
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #222222; 
    border: 3px solid #daa520; 
    padding: 20px; 
    width: 440px; 
    text-align: center; 
    color: white; 
    border-radius: 8px; 
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
    z-index: 10;
  }
  .shop-btn { 
    display: block; 
    margin: 8px auto; 
    padding: 10px; 
    background: #333333; 
    color: #daa520; 
    border: 1px solid #daa520; 
    cursor: pointer; 
    width: 95%; 
    font-size: 13px; 
    font-weight: bold;
    border-radius: 4px;
    transition: 0.2s;
  }
  .shop-btn:hover { 
    background: #daa520; 
    color: #111111; 
  }
  .craft-btn {
    color: #2ecc71;
    border-color: #2ecc71;
  }
  .craft-btn:hover {
    background: #2ecc71;
    color: #111111;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <!-- Merchant Shop -->
  <div id="shop" class="modal-shop">
    <h2 style="color: #daa520; margin-bottom: 6px;">Wandering Merchant</h2>
    <p style="font-style: italic; color: #aaaaaa; margin-bottom: 10px;">"I trade platinum for all timber types!"</p>
    <button class="shop-btn" id="btn-sell">Sell All Timber Inventory [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe Damage [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>

  <!-- Crafting Table Modal -->
  <div id="crafting" class="modal-shop" style="border-color: #2ecc71;">
    <h2 style="color: #2ecc71; margin-bottom: 6px;">Crafting Table</h2>
    <p style="font-style: italic; color: #aaaaaa; margin-bottom: 10px;">"Forge fishing treasures into powerful upgrades!"</p>
    <button class="shop-btn craft-btn" id="craft-rod">Upgrade Rod Speed [1]</button>
    <button class="shop-btn craft-btn" id="craft-speed">Swift Boots +Speed [2]</button>
    <button class="shop-btn craft-btn" id="craft-luck">Shark Luck Charm +Luck [3]</button>
    <button class="shop-btn craft-btn" id="craft-hitbox">Dolphin Ring +Multi-Chop [4]</button>
    <button class="shop-btn craft-btn" id="craft-timmah" style="border-color:#f1c40f; color:#f1c40f;">Timmah's Blessing +ALL STATS [5]</button>
    <button class="shop-btn" id="craft-exit" style="margin-top:8px;">Exit Crafting [E]</button>
  </div>
</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const shopDiv = document.getElementById('shop');
    const craftDiv = document.getElementById('crafting');

    let WIDTH = window.innerWidth;
    let HEIGHT = window.innerHeight;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        WIDTH = canvas.width;
        HEIGHT = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const PLAYER_SIZE = 40;
    const TREE_SIZE = 80;
    const POND_SIZE = 110;
    const CHUNK_SIZE = 800;
    const RESPAWN_TIME = 25000;
    const BASE_CHOP_TIME = 10000;
    const BASE_FISH_TIME = 6000;

    let inMenu = false;
    let menuType = null;
    let keys = {};

    const TREE_TYPES = {
        oak:      { name: "Oak",      color: "#274e13", trunk: "#4a2e16", val: 5,  weight: 55 },
        birch:    { name: "Birch",    color: "#80a832", trunk: "#e0e0e0", val: 7,  weight: 22 },
        pine:     { name: "Pine",     color: "#0f381e", trunk: "#3d220f", val: 10, weight: 12 },
        golden:   { name: "Golden",   color: "#f39c12", trunk: "#6e4213", val: 15, weight: 7  },
        majestic: { name: "Majestic", color: "rainbow", trunk: "#2c3e50", val: 25, weight: 4  }
    };

    const FISH_TYPES = {
        seaweed:     { name: "Seaweed",       color: "#2ecc71" },
        fishScales:  { name: "Fish Scales",   color: "#3498db" },
        sharkTeeth:  { name: "Shark Teeth",   color: "#95a5a6" },
        dolphinTail: { name: "Dolphin Tail",  color: "#9b59b6" },
        timmahsGold: { name: "Timmah's Gold", color: "#f1c40f" }
    };

    const grassCanvas = document.createElement('canvas');
    grassCanvas.width = 64; 
    grassCanvas.height = 64;
    const gCtx = grassCanvas.getContext('2d');
    gCtx.fillStyle = '#3b5e2b'; 
    gCtx.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 150; i++) {
        gCtx.fillStyle = (i % 2 === 0) ? '#456d33' : '#314f24'; 
        gCtx.fillRect(Math.random() * 64, Math.random() * 64, 2, 4);
    }
    const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

    // Player State
    const player = {
        x: 0, y: 0, 
        speed: 4, 
        platinum: 0,
        inventory: { oak: 0, birch: 0, pine: 0, golden: 0, majestic: 0 },
        fishLoot: { seaweed: 0, fishScales: 0, sharkTeeth: 0, dolphinTail: 0, timmahsGold: 0 },
        axe_level: 1, axe_damage: 1,
        axe_range: 85,
        axe_multi: false,
        rod_level: 1,
        rod_luck: 0,
        facing: 'down',
        choppingTarget: null,
        chopProgress: 0,
        fishingTarget: null,
        fishProgress: 0
    };

    const merchant = { x: 120, y: -80 }; 
    const craftingTable = { x: 240, y: -80 };

    let trees = [];
    let ponds = [];
    let particles = [];
    let popups = [];
    let chunksGenerated = {};
    let respawnQueue = [];
    let screenShake = 0;

    // --- Save & Load System ---
    function saveGame() {
        const saveData = {
            x: player.x,
            y: player.y,
            speed: player.speed,
            platinum: player.platinum,
            inventory: player.inventory,
            fishLoot: player.fishLoot,
            axe_level: player.axe_level,
            axe_damage: player.axe_damage,
            axe_range: player.axe_range,
            axe_multi: player.axe_multi,
            rod_level: player.rod_level,
            rod_luck: player.rod_luck
        };
        localStorage.setItem('stormblade_save', JSON.stringify(saveData));
        spawnPopUp("💾 Game Saved!", "#f1c40f", player.x, player.y - 45);
    }

    function loadGame() {
        const dataStr = localStorage.getItem('stormblade_save');
        if (dataStr) {
            try {
                const data = JSON.parse(dataStr);
                if (data.x !== undefined) player.x = data.x;
                if (data.y !== undefined) player.y = data.y;
                if (data.speed !== undefined) player.speed = data.speed;
                if (data.platinum !== undefined) player.platinum = data.platinum;
                if (data.inventory) Object.assign(player.inventory, data.inventory);
                if (data.fishLoot) Object.assign(player.fishLoot, data.fishLoot);
                if (data.axe_level !== undefined) player.axe_level = data.axe_level;
                if (data.axe_damage !== undefined) player.axe_damage = data.axe_damage;
                if (data.axe_range !== undefined) player.axe_range = data.axe_range;
                if (data.axe_multi !== undefined) player.axe_multi = data.axe_multi;
                if (data.rod_level !== undefined) player.rod_level = data.rod_level;
                if (data.rod_luck !== undefined) player.rod_luck = data.rod_luck;
            } catch(e) {
                console.error("Save loading error:", e);
            }
        }
    }

    // Load initial save data
    loadGame();

    // Auto-save every 10 seconds
    setInterval(saveGame, 10000);

    function getRandomTreeType() {
        let rand = Math.random() * 100;
        let cumulative = 0;
        for (let key in TREE_TYPES) {
            cumulative += TREE_TYPES[key].weight;
            if (rand <= cumulative) return key;
        }
        return 'oak';
    }

    function generateChunk(cx, cy) {
        let key = cx + '_' + cy;
        if (chunksGenerated[key]) return;
        chunksGenerated[key] = true;

        let treeCount = Math.floor(Math.random() * 5) + 4; 
        for (let i = 0; i < treeCount; i++) {
            let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            
            let distToMerchant = Math.sqrt(Math.pow(tx - merchant.x, 2) + Math.pow(ty - merchant.y, 2));
            if (distToMerchant < 180) continue; 
            
            trees.push({ id: Math.random(), type: getRandomTreeType(), x: tx, y: ty });
        }

        if (Math.random() < 0.45 && (cx !== 0 || cy !== 0)) {
            let px = cx * CHUNK_SIZE + 120 + Math.random() * (CHUNK_SIZE - POND_SIZE - 240);
            let py = cy * CHUNK_SIZE + 120 + Math.random() * (CHUNK_SIZE - POND_SIZE - 240);
            ponds.push({ id: Math.random(), x: px, y: py, r: 45 + Math.random() * 15 });
        }
    }

    function updateWorldChunks() {
        let cx = Math.floor(player.x / CHUNK_SIZE);
        let cy = Math.floor(player.y / CHUNK_SIZE);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
            for (let y = cy - 1; y <= cy + 1; y++) {
                generateChunk(x, y);
            }
        }
    }

    function spawnPopUp(text, color, x, y) {
        popups.push({ text: text, color: color, x: x, y: y, life: 45, vy: -1.2 });
    }

    function spawnWoodChips(x, y, treeType) {
        let chipColor = TREE_TYPES[treeType].trunk;
        if (treeType === 'majestic') chipColor = 'hsl(' + Math.floor(Math.random() * 360) + ', 100%, 60%)';
        else if (treeType === 'golden') chipColor = '#f1c40f';

        for (let i = 0; i < 4; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 18,
                color: chipColor
            });
        }
    }

    function getFishDrop() {
        let luckMult = 1 + player.rod_luck;
        let timmahChance = 0.005 * luckMult;
        let dolphinChance = 0.03 * luckMult;
        let sharkChance = 0.10 * luckMult;
        let scaleChance = 0.28 * luckMult;

        let roll = Math.random();
        if (roll < timmahChance) return 'timmahsGold';
        if (roll < timmahChance + dolphinChance) return 'dolphinTail';
        if (roll < timmahChance + dolphinChance + sharkChance) return 'sharkTeeth';
        if (roll < timmahChance + dolphinChance + sharkChance + scaleChance) return 'fishScales';
        return 'seaweed';
    }

    window.addEventListener('keydown', function(e) {
        keys[e.key.toLowerCase()] = true;
        keys[e.code] = true; 
        
        if (inMenu) {
            if (menuType === 'shop') {
                if (e.key === '1') document.getElementById('btn-sell').click();
                if (e.key === '2') document.getElementById('btn-upgrade').click();
                if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById('btn-exit').click();
            } else if (menuType === 'crafting') {
                if (e.key === '1') document.getElementById('craft-rod').click();
                if (e.key === '2') document.getElementById('craft-speed').click();
                if (e.key === '3') document.getElementById('craft-luck').click();
                if (e.key === '4') document.getElementById('craft-hitbox').click();
                if (e.key === '5') document.getElementById('craft-timmah').click();
                if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById('craft-exit').click();
            }
            return; 
        }

        if (e.key.toLowerCase() === 'e') {
            let mDist = Math.sqrt(Math.pow((merchant.x+20) - (player.x+20), 2) + Math.pow((merchant.y+20) - (player.y+20), 2));
            if (mDist < 80) {
                inMenu = true;
                menuType = 'shop';
                shopDiv.style.display = 'block';
                updateShopUI();
                return;
            }

            let cDist = Math.sqrt(Math.pow((craftingTable.x+20) - (player.x+20), 2) + Math.pow((craftingTable.y+20) - (player.y+20), 2));
            if (cDist < 80) {
                inMenu = true;
                menuType = 'crafting';
                craftDiv.style.display = 'block';
                updateCraftingUI();
                return;
            }
        }
    });

    window.addEventListener('keyup', function(e) { 
        keys[e.key.toLowerCase()] = false; 
        keys[e.code] = false; 
    });

    function updateShopUI() {
        document.getElementById('btn-upgrade').innerText = `Upgrade Axe Damage (${player.axe_level * 50} Plat) [2]`;
    }

    function updateCraftingUI() {
        document.getElementById('craft-rod').innerText = `Upgrade Rod Speed (Lvl ${player.rod_level}) [1] - 10 Seaweed (Have: ${player.fishLoot.seaweed})`;
        document.getElementById('craft-speed').innerText = `Swift Boots (+Speed) [2] - 8 Fish Scales (Have: ${player.fishLoot.fishScales})`;
        document.getElementById('craft-luck').innerText = `Shark Luck Charm (+Luck) [3] - 5 Shark Teeth (Have: ${player.fishLoot.sharkTeeth})`;
        document.getElementById('craft-hitbox').innerText = `Dolphin Ring (+Multi-Chop) [4] - 3 Dolphin Tails (Have: ${player.fishLoot.dolphinTail})`;
        document.getElementById('craft-timmah').innerText = `Timmah's Blessing (+ALL STATS) [5] - 1 Timmah Gold (Have: ${player.fishLoot.timmahsGold})`;
    }

    document.getElementById('btn-sell').onclick = function() {
        let earned = 0;
        for (let type in player.inventory) {
            earned += player.inventory[type] * TREE_TYPES[type].val;
            player.inventory[type] = 0;
        }
        player.platinum += earned;
        saveGame();
    };

    document.getElementById('btn-upgrade').onclick = function() {
        let cost = player.axe_level * 50;
        if (player.platinum >= cost) {
            player.platinum -= cost;
            player.axe_level++;
            player.axe_damage++;
            updateShopUI();
            saveGame();
        }
    };

    document.getElementById('btn-exit').onclick = function() {
        inMenu = false;
        menuType = null;
        shopDiv.style.display = 'none';
    };

    // Crafting Actions
    document.getElementById('craft-rod').onclick = function() {
        if (player.fishLoot.seaweed >= 10) {
            player.fishLoot.seaweed -= 10;
            player.rod_level += 1;
            spawnPopUp("Rod Speed Upgraded!", "#2ecc71", player.x, player.y - 40);
            updateCraftingUI();
            saveGame();
        }
    };
    document.getElementById('craft-speed').onclick = function() {
        if (player.fishLoot.fishScales >= 8) {
            player.fishLoot.fishScales -= 8;
            player.speed += 1.2;
            spawnPopUp("Movement Speed Increased!", "#3498db", player.x, player.y - 40);
            updateCraftingUI();
            saveGame();
        }
    };
    document.getElementById('craft-luck').onclick = function() {
        if (player.fishLoot.sharkTeeth >=
