<!DOCTYPE html>
<html>
<head>
<title>Stormblade</title>
<style>
  body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; overflow: hidden; }
  canvas { box-shadow: 0 0 15px #000; }
  #shop { display: none; position: absolute; background: #282828; border: 3px solid #E5E4E2; padding: 20px; width: 400px; text-align: center; color: white; border-radius: 8px; font-family: 'Courier New', Courier, monospace; }
  .shop-btn { display: block; margin: 10px auto; padding: 10px; background: #444; color: white; border: 1px solid #E5E4E2; cursor: pointer; width: 80%; font-size: 16px; transition: 0.2s; }
  .shop-btn:hover { background: #5a7d5a; border-color: white; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="shop">
    <h2 style="color: #E5E4E2;">Wandering Merchant</h2>
    <p><i>"Need a sharper blade, traveler?"</i></p>
    <button class="shop-btn" id="btn-sell">Sell all Wood (5 Plat each) [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const shopDiv = document.getElementById('shop');

const TILE_SIZE = 40;
const WIDTH = 800, HEIGHT = 600;
const CHUNK_SIZE = 600;
const RESPAWN_TIME = 20000;

let inShop = false;
let keys = {};

const grassCanvas = document.createElement('canvas');
grassCanvas.width = 100; grassCanvas.height = 100;
const gCtx = grassCanvas.getContext('2d');
gCtx.fillStyle = '#4f7541'; 
gCtx.fillRect(0, 0, 100, 100);
for (let i = 0; i < 400; i++) {
    gCtx.fillStyle = Math.random() > 0.5 ? '#5b874b' : '#436337'; 
    gCtx.fillRect(Math.random() * 100, Math.random() * 100, 2, 6 + Math.random() * 4);
}
const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

const player = {
    x: 0, y: 0, 
    speed: 4, wood: 0, platinum: 0,
    axe_level: 1, axe_damage: 1,
    facing: 'down'
};

const merchant = { x: 100, y: -100 }; 

let trees = [];
let chunksGenerated = new Set();
let respawnQueue = [];

function generateChunk(cx, cy) {
    let key = cx + ',' + cy;
    if (chunksGenerated.has(key)) return;
    chunksGenerated.add(key);

    let treeCount = Math.floor(Math.random() * 8) + 6; 
    for (let i = 0; i < treeCount; i++) {
        let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TILE_SIZE);
        let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TILE_SIZE);
        
        if (Math.hypot(tx - merchant.x, ty - merchant.y) < 150) continue; 
        
        trees.push({ x: tx, y: ty, health: 3, id: Math.random() });
    }
}

function updateWorldChunks() {
    let cx = Math.floor(player.x / CHUNK_SIZE);
    let cy = Math.floor(player.y / CHUNK_SIZE);
    
    for (let x = cx - 1; x <= cx + 1; x++) {
        for (let y = cy - 1; y <= cy + 1; y++) {
            generateChunk(x, y);
        }
    }
}

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true; 
    
    if (inShop) {
        if (e.key === '1') document.getElementById('btn-sell').click();
        if (e.key === '2') document.getElementById('btn-upgrade').click();
        if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById('btn-exit').click();
        return; 
    }

    let reachArea = {x: player.x, y: player.y, w: TILE_SIZE, h: TILE_SIZE};
    let reach = 25;
    if (player.facing === 'up') { reachArea.y -= reach; reachArea.h = reach; }
    else if (player.facing === 'down') { reachArea.y += TILE_SIZE; reachArea.h = reach; }
    else if (player.facing === 'left') { reachArea.x -= reach; reachArea.w = reach; }
    else if (player.facing === 'right') { reachArea.x += TILE_SIZE; reachArea.w = reach; }

    if (e.code === 'Space') {
        for (let i = trees.length - 1; i >= 0; i--) {
            let t = trees[i];
