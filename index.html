<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stormblade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #1a1a1a; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    font-family: Arial, sans-serif; 
    overflow: hidden; 
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  canvas { 
    background-color: #3b5e2b;
    box-shadow: 0 0 20px rgba(0,0,0,0.8); 
    border-radius: 6px;
    display: block;
  }
  #shop { 
    display: none; 
    position: absolute; 
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #222222; 
    border: 3px solid #daa520; 
    padding: 25px; 
    width: 360px; 
    text-align: center; 
    color: white; 
    border-radius: 8px; 
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
  }
  .shop-btn { 
    display: block; 
    margin: 12px auto; 
    padding: 12px; 
    background: #333333; 
    color: #daa520; 
    border: 1px solid #daa520; 
    cursor: pointer; 
    width: 90%; 
    font-size: 15px; 
    font-weight: bold;
    border-radius: 4px;
  }
  .shop-btn:hover { 
    background: #daa520; 
    color: #111111; 
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="shop">
    <h2 style="color: #daa520; margin-bottom: 10px;">Wandering Merchant</h2>
    <p style="font-style: italic; color: #aaaaaa; margin-bottom: 15px;">"Trade your timber for fine platinum!"</p>
    <button class="shop-btn" id="btn-sell">Sell Wood (+5 Plat/ea) [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>
</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const shopDiv = document.getElementById('shop');

    const PLAYER_SIZE = 40;
    const TREE_SIZE = 80; // Scaled up tree size
    const WIDTH = 800, HEIGHT = 600;
    const CHUNK_SIZE = 800;
    const RESPAWN_TIME = 25000;
    const BASE_CHOP_TIME = 10000; // 10 Seconds for Axe Level 1

    let inShop = false;
    let keys = {};

    // Procedural grass texture
    const grassCanvas = document.createElement('canvas');
    grassCanvas.width = 64; 
    grassCanvas.height = 64;
    const gCtx = grassCanvas.getContext('2d');
    gCtx.fillStyle = '#3b5e2b'; 
    gCtx.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 150; i++) {
        gCtx.fillStyle = (i % 2 === 0) ? '#456d33' : '#314f24'; 
        gCtx.fillRect(Math.random() * 64, Math.random() * 64, 2, 4);
    }
    const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

    // Player State
    const player = {
        x: 0, y: 0, 
        speed: 4, wood: 0, platinum: 0,
        axe_level: 1, axe_damage: 1,
        facing: 'down',
        choppingTarget: null,
        chopProgress: 0
    };

    const merchant = { x: 120, y: -80 }; 

    let trees = [];
    let particles = [];
    let chunksGenerated = {};
    let respawnQueue = [];
    let screenShake = 0;

    function generateChunk(cx, cy) {
        let key = cx + '_' + cy;
        if (chunksGenerated[key]) return;
        chunksGenerated[key] = true;

        let treeCount = Math.floor(Math.random() * 6) + 5; 
        for (let i = 0; i < treeCount; i++) {
            let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            
            let distToMerchant = Math.sqrt(Math.pow(tx - merchant.x, 2) + Math.pow(ty - merchant.y, 2));
            if (distToMerchant < 160) continue; 
            
            trees.push({ id: Math.random(), x: tx, y: ty });
        }
    }

    function updateWorldChunks() {
        let cx = Math.floor(player.x / CHUNK_SIZE);
        let cy = Math.floor(player.y / CHUNK_SIZE);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
            for (let y = cy - 1; y <= cy + 1; y++) {
                generateChunk(x, y);
            }
        }
    }

    function spawnWoodChips(x, y) {
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 15,
                color: Math.random() > 0.5 ? '#8b5a2b' : '#d2b48c'
            });
        }
    }

    // Input Listeners
    window.addEventListener('keydown', function(e) {
        keys[e.key.toLowerCase()] = true;
        keys[e.code] = true; 
        
        if (inShop) {
            if (e.key === '1') document.getElementById('btn-sell').click();
            if (e.key === '2') document.getElementById('btn-upgrade').click();
            if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById('btn-exit').click();
            return; 
        }

        if (e.key.toLowerCase() === 'e') {
            let mDist = Math.sqrt(Math.pow((merchant.x+20) - (player.x+20), 2) + Math.pow((merchant.y+20) - (player.y+20), 2));
            if (mDist < 80) {
                inShop = true;
                shopDiv.style.display = 'block';
                updateShopUI();
            }
        }
    });

    window.addEventListener('keyup', function(e) { 
        keys[e.key.toLowerCase()] = false; 
        keys[e.code] = false; 
    });

    function updateShopUI() {
        document.getElementById('btn-upgrade').innerText = `Upgrade Axe (${player.axe_level * 50} Plat) [2]`;
    }
    document.getElementById('btn-sell').onclick = function() {
        if (player.wood > 0) {
            player.platinum += player.wood * 5;
            player.wood = 0;
        }
    };
    document.getElementById('btn-upgrade').onclick = function() {
        let cost = player.axe_level * 50;
        if (player.platinum >= cost) {
            player.platinum -= cost;
            player.axe_level++;
            player.axe_damage++;
            updateShopUI();
        }
    };
    document.getElementById('btn-exit').onclick = function() {
        inShop = false;
        shopDiv.style.display = 'none';
    };

    function getNearbyTree() {
        let pCenterX = player.x + PLAYER_SIZE / 2;
        let pCenterY = player.y + PLAYER_SIZE / 2;

        for (let i = 0; i < trees.length; i++) {
            let t = trees[i];
            let tCenterX = t.x + TREE_SIZE / 2;
            let tCenterY = t.y + TREE_SIZE / 2;
            
            // Expanded hitbox distance check
            let dist = Math.sqrt(Math.pow(pCenterX - tCenterX, 2) + Math.pow(pCenterY - tCenterY, 2));
            if (dist < 75) {
                return t;
            }
        }
        return null;
    }

    function update(dt) {
        if (!inShop) {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) { dy -= player.speed; player.facing = 'up'; }
            if (keys['s'] || keys['arrowdown']) { dy += player.speed; player.facing = 'down'; }
            if (keys['a'] || keys['arrowleft']) { dx -= player.speed; player.facing = 'left'; }
            if (keys['d'] || keys['arrowright']) { dx += player.speed; player.facing = 'right'; }

            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

            player.x += dx;
            player.y += dy;
            
            updateWorldChunks();
        }

        // Tree Chopping (Hold Spacebar)
        let targetTree = getNearbyTree();
        if (keys['Space'] && targetTree && !inShop) {
            if (player.choppingTarget !== targetTree) {
                player.choppingTarget = targetTree;
                player.chopProgress = 0;
            }

            // Calculate Chop Speed based on Axe Damage
            let requiredTime = BASE_CHOP_TIME / player.axe_damage;
            player.chopProgress += dt;

            if (Math.random() < 0.3) {
                spawnWoodChips(targetTree.x + TREE_SIZE / 2, targetTree.y + TREE_SIZE / 2);
            }

            // Tree Felled!
            if (player.chopProgress >= requiredTime) {
                for (let i = 0; i < trees.length; i++) {
                    if (trees[i] === targetTree) {
                        respawnQueue.push({x: targetTree.x, y: targetTree.y, time: Date.now()});
                        trees.splice(i, 1);
                        break;
                    }
                }
                player.wood += Math.floor(Math.random() * 5) + 4; // 4 to 8 wood
                player.choppingTarget = null;
                player.chopProgress = 0;
                screenShake = 10; // Trigger screen shake
            }
        } else {
            player.choppingTarget = null;
            player.chopProgress = 0;
        }

        // Respawn Timers
        let now = Date.now();
        for (let i = respawnQueue.length - 1; i >= 0; i--) {
            if (now - respawnQueue[i].time >= RESPAWN_TIME) {
                trees.push({id: Math.random(), x: respawnQueue[i].x, y: respawnQueue[i].y});
                respawnQueue.splice(i, 1);
            }
        }

        // Update Wood Chip Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (screenShake > 0) screenShake--;
    }

    function draw() {
        let camX = WIDTH / 2 - player.x - PLAYER_SIZE / 2;
        let camY = HEIGHT / 2 - player.y - PLAYER_SIZE / 2;

        if (screenShake > 0) {
            camX += (Math.random() - 0.5) * 6;
            camY += (Math.random() - 0.5) * 6;
        }

        // Background Grass
        ctx.fillStyle = grassPattern || '#3b5e2b';
        ctx.save(); 
        ctx.translate(camX % 64, camY % 64); 
        ctx.fillRect(-64, -64, WIDTH + 128, HEIGHT + 128);
        ctx.restore();

        // Camera Offset Space
        ctx.save();
        ctx.translate(camX, camY);

        // Merchant Base
        ctx.fillStyle = '#781d1d';
        ctx.fillRect(merchant.x - 20, merchant.y - 10, 80, 60);
        ctx.fillStyle = '#f1c40f'; 
        ctx.fillRect(merchant.x - 20, merchant.y - 10, 80, 4);
        ctx.fillRect(merchant.x - 20, merchant.y + 46, 80, 4);

        // Merchant NPC
        ctx.fillStyle = '#4a2e16';
        ctx.fillRect(merchant.x + 8, merchant.y + 8, 24, 26);
        ctx.fillStyle = '#f5c6a5';
        ctx.fillRect(merchant.x + 12, merchant.y - 2, 16, 12);
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(merchant.x + 10, merchant.y + 8, 20, 16);
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(merchant.x + 8, merchant.y - 8, 24, 8);
        ctx.fillStyle = 'black';
        ctx.fillRect(merchant.x + 14, merchant.y + 2, 3, 3);
        ctx.fillRect(merchant.x + 23, merchant.y + 2, 3, 3);

        // Render Bigger Swaying Trees
        let time = Date.now();
        let nearbyTree = getNearbyTree();

        for (let i = 0; i < trees.length; i++) {
            let t = trees[i];
            if (t.x > player.x - 600 && t.x < player.x + 600 && t.y > player.y - 500 && t.y < player.y + 500) {
                let sway = Math.sin((time / 350) + t.x) * 4; 
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(t.x + TREE_SIZE/2, t.y + TREE_SIZE - 5, 35, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Large Trunk
                ctx.fillStyle = '#4a2e16'; 
                ctx.fillRect(t.x + 28, t.y + 35, 24, 45);
                
                // Massive Triple-Layer Canopy
                ctx.fillStyle = '#1e3d0f'; 
                ctx.beginPath();
                ctx.arc(t.x + 40 + sway, t.y + 10, 38, 0, Math.PI * 2); 
                ctx.arc(t.x + 15 + sway, t.
