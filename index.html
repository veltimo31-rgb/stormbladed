<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stormblade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: #1a1a1a; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    font-family: Arial, sans-serif; 
    overflow: hidden; 
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 800px;
    height: 600px;
  }
  canvas { 
    background-color: #3b5e2b;
    box-shadow: 0 0 20px rgba(0,0,0,0.8); 
    border-radius: 6px;
    display: block;
  }
  #shop { 
    display: none; 
    position: absolute; 
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #222222; 
    border: 3px solid #daa520; 
    padding: 25px; 
    width: 380px; 
    text-align: center; 
    color: white; 
    border-radius: 8px; 
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
  }
  .shop-btn { 
    display: block; 
    margin: 10px auto; 
    padding: 12px; 
    background: #333333; 
    color: #daa520; 
    border: 1px solid #daa520; 
    cursor: pointer; 
    width: 95%; 
    font-size: 14px; 
    font-weight: bold;
    border-radius: 4px;
  }
  .shop-btn:hover { 
    background: #daa520; 
    color: #111111; 
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="shop">
    <h2 style="color: #daa520; margin-bottom: 8px;">Wandering Merchant</h2>
    <p style="font-style: italic; color: #aaaaaa; margin-bottom: 12px;">"I trade platinum for all timber types!"</p>
    <button class="shop-btn" id="btn-sell">Sell All Timber Inventory [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>
</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const shopDiv = document.getElementById('shop');

    const PLAYER_SIZE = 40;
    const TREE_SIZE = 80;
    const WIDTH = 800, HEIGHT = 600;
    const CHUNK_SIZE = 800;
    const RESPAWN_TIME = 25000;
    const BASE_CHOP_TIME = 10000; // 10s Base for Axe Lvl 1

    let inShop = false;
    let keys = {};

    // Tree Types Configuration
    const TREE_TYPES = {
        oak:      { name: "Oak",      color: "#274e13", trunk: "#4a2e16", val: 5,  weight: 55 },
        birch:    { name: "Birch",    color: "#80a832", trunk: "#e0e0e0", val: 7,  weight: 22 },
        pine:     { name: "Pine",     color: "#0f381e", trunk: "#3d220f", val: 10, weight: 12 },
        golden:   { name: "Golden",   color: "#f39c12", trunk: "#6e4213", val: 15, weight: 7  },
        majestic: { name: "Majestic", color: "rainbow", trunk: "#2c3e50", val: 25, weight: 4  }
    };

    // Procedural grass texture
    const grassCanvas = document.createElement('canvas');
    grassCanvas.width = 64; 
    grassCanvas.height = 64;
    const gCtx = grassCanvas.getContext('2d');
    gCtx.fillStyle = '#3b5e2b'; 
    gCtx.fillRect(0, 0, 64, 64);
    for (let i = 0; i < 150; i++) {
        gCtx.fillStyle = (i % 2 === 0) ? '#456d33' : '#314f24'; 
        gCtx.fillRect(Math.random() * 64, Math.random() * 64, 2, 4);
    }
    const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

    // Player State
    const player = {
        x: 0, y: 0, 
        speed: 4, platinum: 0,
        inventory: { oak: 0, birch: 0, pine: 0, golden: 0, majestic: 0 },
        axe_level: 1, axe_damage: 1,
        facing: 'down',
        choppingTarget: null,
        chopProgress: 0
    };

    const merchant = { x: 120, y: -80 }; 

    let trees = [];
    let particles = [];
    let chunksGenerated = {};
    let respawnQueue = [];
    let screenShake = 0;

    function getRandomTreeType() {
        let rand = Math.random() * 100;
        let cumulative = 0;
        for (let key in TREE_TYPES) {
            cumulative += TREE_TYPES[key].weight;
            if (rand <= cumulative) return key;
        }
        return 'oak';
    }

    function generateChunk(cx, cy) {
        let key = cx + '_' + cy;
        if (chunksGenerated[key]) return;
        chunksGenerated[key] = true;

        let treeCount = Math.floor(Math.random() * 6) + 5; 
        for (let i = 0; i < treeCount; i++) {
            let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            
            let distToMerchant = Math.sqrt(Math.pow(tx - merchant.x, 2) + Math.pow(ty - merchant.y, 2));
            if (distToMerchant < 160) continue; 
            
            trees.push({ id: Math.random(), type: getRandomTreeType(), x: tx, y: ty });
        }
    }

    function updateWorldChunks() {
        let cx = Math.floor(player.x / CHUNK_SIZE);
        let cy = Math.floor(player.y / CHUNK_SIZE);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
            for (let y = cy - 1; y <= cy + 1; y++) {
                generateChunk(x, y);
            }
        }
    }

    function spawnWoodChips(x, y, treeType) {
        let chipColor = TREE_TYPES[treeType].trunk;
        if (treeType === 'majestic') chipColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
        else if (treeType === 'golden') chipColor = '#f1c40f';

        for (let i = 0; i < 4; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 18,
                color: chipColor
            });
        }
    }

    // Input Listeners
    window.addEventListener('keydown', function(e) {
        keys[e.key.toLowerCase()] = true;
        keys[e.code] = true; 
        
        if (inShop) {
            if (e.key === '1') document.getElementById('btn-sell').click();
            if (e.key === '2') document.getElementById('btn-upgrade').click();
            if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById('btn-exit').click();
            return; 
        }

        if (e.key.toLowerCase() === 'e') {
            let mDist = Math.sqrt(Math.pow((merchant.x+20) - (player.x+20), 2) + Math.pow((merchant.y+20) - (player.y+20), 2));
            if (mDist < 80) {
                inShop = true;
                shopDiv.style.display = 'block';
                updateShopUI();
            }
        }
    });

    window.addEventListener('keyup', function(e) { 
        keys[e.key.toLowerCase()] = false; 
        keys[e.code] = false; 
    });

    function updateShopUI() {
        document.getElementById('btn-upgrade').innerText = `Upgrade Axe (${player.axe_level * 50} Plat) [2]`;
    }

    document.getElementById('btn-sell').onclick = function() {
        let earned = 0;
        for (let type in player.inventory) {
            earned += player.inventory[type] * TREE_TYPES[type].val;
            player.inventory[type] = 0;
        }
        player.platinum += earned;
    };

    document.getElementById('btn-upgrade').onclick = function() {
        let cost = player.axe_level * 50;
        if (player.platinum >= cost) {
            player.platinum -= cost;
            player.axe_level++;
            player.axe_damage++;
            updateShopUI();
        }
    };

    document.getElementById('btn-exit').onclick = function() {
        inShop = false;
        shopDiv.style.display = 'none';
    };

    function getNearbyTree() {
        let pCenterX = player.x + PLAYER_SIZE / 2;
        let pCenterY = player.y + PLAYER_SIZE / 2;

        for (let i = 0; i < trees.length; i++) {
            let t = trees[i];
            let tCenterX = t.x + TREE_SIZE / 2;
            let tCenterY = t.y + TREE_SIZE / 2;
            
            let dist = Math.sqrt(Math.pow(pCenterX - tCenterX, 2) + Math.pow(pCenterY - tCenterY, 2));
            if (dist < 85) return t;
        }
        return null;
    }

    function update(dt) {
        if (!inShop) {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) { dy -= player.speed; player.facing = 'up'; }
            if (keys['s'] || keys['arrowdown']) { dy += player.speed; player.facing = 'down'; }
            if (keys['a'] || keys['arrowleft']) { dx -= player.speed
