<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Version Tag to Force Refresh: v2.0 -->
<title>Stormblade - Infinite Forest</title>
<style>
  body { 
    background: #111; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    font-family: Arial, sans-serif; 
    overflow: hidden; 
  }
  canvas { 
    box-shadow: 0 0 20px #000; 
    border-radius: 4px;
  }
  #shop { 
    display: none; 
    position: absolute; 
    background: #222; 
    border: 3px solid #daa520; 
    padding: 20px; 
    width: 380px; 
    text-align: center; 
    color: white; 
    border-radius: 10px; 
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    font-family: 'Georgia', serif;
  }
  .shop-btn { 
    display: block; 
    margin: 12px auto; 
    padding: 12px; 
    background: #333; 
    color: #daa520; 
    border: 1px solid #daa520; 
    cursor: pointer; 
    width: 85%; 
    font-size: 15px; 
    font-weight: bold;
    border-radius: 5px;
    transition: 0.2s; 
  }
  .shop-btn:hover { 
    background: #daa520; 
    color: #111; 
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="shop">
    <h2 style="color: #daa520; margin-top:0;">Wandering Merchant</h2>
    <p style="font-style: italic; color: #ccc;">"Trade your timber for fine platinum!"</p>
    <button class="shop-btn" id="btn-sell">Sell Wood (5 Plat each) [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>
</div>

<script>
// --- Canvas Setup ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const shopDiv = document.getElementById('shop');

const TILE_SIZE = 40;
const WIDTH = 800, HEIGHT = 600;
const CHUNK_SIZE = 600;
const RESPAWN_TIME = 20000;

let inShop = false;
let keys = {};

// --- Dynamic Grass Texture Generation ---
const grassCanvas = document.createElement('canvas');
grassCanvas.width = 128; 
grassCanvas.height = 128;
const gCtx = grassCanvas.getContext('2d');

// Base Dark Grass
gCtx.fillStyle = '#3a5a2a'; 
gCtx.fillRect(0, 0, 128, 128);

// Add Individual Grass Blade Details
for (let i = 0; i < 600; i++) {
    gCtx.fillStyle = Math.random() > 0.5 ? '#486d35' : '#2d4720'; 
    gCtx.fillRect(Math.random() * 128, Math.random() * 128, 2, 5 + Math.random() * 5);
}
// Flower patches
for (let i = 0; i < 12; i++) {
    gCtx.fillStyle = Math.random() > 0.5 ? '#f1c40f' : '#ffffff';
    gCtx.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
}
const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

// --- Player & World State ---
const player = {
    x: 0, y: 0, 
    speed: 4, wood: 0, platinum: 0,
    axe_level: 1, axe_damage: 1,
    facing: 'down'
};

const merchant = { x: 120, y: -80 }; 

let trees = [];
let chunksGenerated = new Set();
let respawnQueue = [];

// --- Infinite World Chunk Generation ---
function generateChunk(cx, cy) {
    let key = cx + ',' + cy;
    if (chunksGenerated.has(key)) return;
    chunksGenerated.add(key);

    let treeCount = Math.floor(Math.random() * 9) + 7; 
    for (let i = 0; i < treeCount; i++) {
        let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TILE_SIZE);
        let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TILE_SIZE);
        
        // Don't spawn trees on top of merchant
        if (Math.hypot(tx - merchant.x, ty - merchant.y) < 140) continue; 
        
        trees.push({ x: tx, y: ty, health: 3, id: Math.random() });
    }
}

function updateWorldChunks() {
    let cx = Math.floor(player.x / CHUNK_SIZE);
    let cy = Math.floor(player.y / CHUNK_SIZE);
    
    for (let x = cx - 1; x <= cx + 1; x++) {
        for (let y = cy - 1; y <= cy + 1; y++) {
            generateChunk(x, y);
        }
    }
}

    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
