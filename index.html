<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stormblade</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    width: 100%; height: 100%; margin: 0; padding: 0; 
    background-color: #1a1a1a; font-family: Arial, sans-serif; 
    overflow: hidden; user-select: none;
  }
  #game-container { position: relative; width: 100vw; height: 100vh; }
  canvas { width: 100vw; height: 100vh; background-color: #3b5e2b; display: block; }
  
  .modal-shop { 
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); background: #222; 
    border: 3px solid #daa520; padding: 20px; width: 440px; 
    max-width: 90vw; text-align: center; color: white; 
    border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.9); z-index: 10;
  }
  .shop-btn { 
    display: block; margin: 8px auto; padding: 10px; 
    background: #333; color: #daa520; border: 1px solid #daa520; 
    cursor: pointer; width: 95%; font-size: 13px; font-weight: bold;
    border-radius: 4px; transition: 0.2s;
  }
  .shop-btn:hover { background: #daa520; color: #111; }
  .craft-btn { color: #2ecc71; border-color: #2ecc71; }
  .craft-btn:hover { background: #2ecc71; color: #111; }

  /* Chat UI Panel */
  #chat-container {
    position: absolute; bottom: 20px; left: 20px; width: 340px;
    z-index: 5; display: flex; flex-direction: column; gap: 6px;
  }
  #chat-messages {
    max-height: 180px; overflow-y: auto; color: white; font-size: 13px;
    text-shadow: 1px 1px 2px black; display: flex; flex-direction: column;
    pointer-events: none; padding-right: 5px;
  }
  .chat-msg { margin-bottom: 4px; background: rgba(0,0,0,0.5); padding: 5px 8px; border-radius: 4px; line-height: 1.3; }
  #chat-input {
    width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.7); color: white;
    border: 1px solid #777; border-radius: 4px; outline: none; font-size: 14px;
  }
  #chat-input:focus { border-color: #3498db; background: rgba(0,0,0,0.9); }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Press Enter to chat..." autocomplete="off">
  </div>
  
  <div id="shop" class="modal-shop">
    <h2 style="color: #daa520; margin-bottom: 6px;">Wandering Merchant</h2>
    <button class="shop-btn" id="btn-sell">Sell All Timber Inventory [1]</button>
    <button class="shop-btn" id="btn-upgrade">Upgrade Axe Damage [2]</button>
    <button class="shop-btn" id="btn-exit">Exit Shop [E]</button>
  </div>

  <div id="crafting" class="modal-shop" style="border-color: #2ecc71;">
    <h2 style="color: #2ecc71; margin-bottom: 6px;">Crafting Table</h2>
    <button class="shop-btn craft-btn" id="craft-rod">Upgrade Rod Speed [1]</button>
    <button class="shop-btn craft-btn" id="craft-speed">Swift Boots +Speed [2]</button>
    <button class="shop-btn craft-btn" id="craft-luck">Shark Luck Charm +Tree Luck [3]</button>
    <button class="shop-btn craft-btn" id="craft-hitbox">Dolphin Ring +Multi-Chop [4]</button>
    <button class="shop-btn craft-btn" id="craft-timmah" style="border-color:#f1c40f; color:#f1c40f;">Timmah's Blessing +ALL STATS [5]</button>
    <button class="shop-btn" id="craft-exit" style="margin-top:8px;">Exit Crafting [E]</button>
  </div>
</div>

<script>
window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const shopDiv = document.getElementById('shop');
    const craftDiv = document.getElementById('crafting');

    let WIDTH = window.innerWidth, HEIGHT = window.innerHeight;
    window.addEventListener('resize', function() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        WIDTH = canvas.width; HEIGHT = canvas.height;
    });
    canvas.width = WIDTH; canvas.height = HEIGHT;

    const PLAYER_SIZE = 40, TREE_SIZE = 80, POND_SIZE = 110, CHUNK_SIZE = 800;
    let inMenu = false, menuType = null, keys = {};

    const TREE_TYPES = {
        oak: { name: "Oak", color: "#274e13", trunk: "#4a2e16", val: 5, weight: 55 },
        birch: { name: "Birch", color: "#80a832", trunk: "#e0e0e0", val: 7, weight: 22 },
        pine: { name: "Pine", color: "#0f381e", trunk: "#3d220f", val: 10, weight: 12 },
        golden: { name: "Golden", color: "#f39c12", trunk: "#6e4213", val: 15, weight: 7 },
        majestic: { name: "Majestic", color: "rainbow", trunk: "#2c3e50", val: 25, weight: 4 }
    };
    const FISH_TYPES = {
        seaweed: { name: "Seaweed", color: "#2ecc71" },
        fishScales: { name: "Fish Scales", color: "#3498db" },
        sharkTeeth: { name: "Shark Teeth", color: "#95a5a6" },
        dolphinTail: { name: "Dolphin Tail", color: "#9b59b6" },
        timmahsGold: { name: "Timmah's Gold", color: "#f1c40f" }
    };

    const grassCanvas = document.createElement('canvas');
    grassCanvas.width = 64; grassCanvas.height = 64;
    const gCtx = grassCanvas.getContext('2d');
    gCtx.fillStyle = '#3b5e2b'; gCtx.fillRect(0, 0, 64, 64);
    for (let i=0; i<150; i++) {
        gCtx.fillStyle = (i%2===0) ? '#456d33' : '#314f24';
        gCtx.fillRect(Math.random()*64, Math.random()*64, 2, 4);
    }
    const grassPattern = ctx.createPattern(grassCanvas, 'repeat');

    const player = {
        x: 0, y: 0, speed: 4, platinum: 0,
        inventory: { oak:0, birch:0, pine:0, golden:0, majestic:0 },
        fishLoot: { seaweed:0, fishScales:0, sharkTeeth:0, dolphinTail:0, timmahsGold:0 },
        axe_level: 1, axe_damage: 1, axe_range: 85, axe_multi: false, axe_luck: 0,
        rod_level: 1, facing: 'down',
        choppingTarget: null, chopProgress: 0, fishingTarget: null, fishProgress: 0
    };

    let trees = [], ponds = [], particles = [], popups = [], chunksGenerated = {}, respawnQueue = [];
    const merchant = { x: 120, y: -80 }, craftingTable = { x: 240, y: -80 };

    const myId = "Player_" + Math.floor(1000 + Math.random() * 9000);

    function addChatMessage(sender, text) {
        let box = document.getElementById('chat-messages');
        if (!box) return;
        let el = document.createElement('div');
        el.className = 'chat-msg';
        let color = sender === myId ? '#f1c40f' : '#2ecc71';
        el.innerHTML = `<strong style="color:${color}">${sender}:</strong> ${text}`;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
    }

    addChatMessage("System", "Press Enter to chat!");

    const chatInput = document.getElementById('chat-input');
    chatInput.addEventListener('keydown', function(e) { e.stopPropagation(); });
    chatInput.addEventListener('keyup', function(e) {
        e.stopPropagation();
        if (e.key === 'Enter') {
            let txt = chatInput.value.trim();
            if (txt !== '') {
                addChatMessage(myId, txt);
                spawnPopUp(txt, "#ffffff", player.x, player.y - 35);
            }
            chatInput.value = ''; chatInput.blur();
        }
    });

    // SAVING LOGIC
    function saveGame() {
        try {
            localStorage.setItem('stormblade_save', JSON.stringify({
                x: player.x, y: player.y, speed: player.speed, platinum: player.platinum,
                inventory: player.inventory, fishLoot: player.fishLoot,
                axe_level: player.axe_level, axe_damage: player.axe_damage, axe_range: player.axe_range,
                axe_multi: player.axe_multi, axe_luck: player.axe_luck, rod_level: player.rod_level
            }));
            spawnPopUp("💾 Game Saved!", "#f1c40f", player.x, player.y - 45);
        } catch(e) {}
    }

    function loadGame() {
        try {
            let str = localStorage.getItem('stormblade_save');
            if (str) {
                let d = JSON.parse(str);
                Object.assign(player, d);
            }
        } catch(e) {}
    }
    loadGame();
    setInterval(saveGame, 10000);

    // WORLD GENERATION
    function getRandomTreeType() {
        let rand = Math.random() * 100;
        let cumulative = 0;
        for (let key in TREE_TYPES) {
            cumulative += TREE_TYPES[key].weight;
            if (rand <= cumulative) return key;
        }
        return 'oak';
    }

    function generateChunk(cx, cy) {
        let key = cx + '_' + cy;
        if (chunksGenerated[key]) return;
        chunksGenerated[key] = true;
        let count = Math.floor(Math.random() * 5) + 4; 
        for (let i = 0; i < count; i++) {
            let tx = cx * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            let ty = cy * CHUNK_SIZE + Math.random() * (CHUNK_SIZE - TREE_SIZE);
            if (Math.hypot(tx - merchant.x, ty - merchant.y) < 180) continue; 
            trees.push({ type: getRandomTreeType(), x: tx, y: ty });
        }
        if (Math.random() < 0.45 && (cx !== 0 || cy !== 0)) {
            let px = cx * CHUNK_SIZE + 120 + Math.random() * (CHUNK_SIZE - POND_SIZE - 240);
            let py = cy * CHUNK_SIZE + 120 + Math.random() * (CHUNK_SIZE - POND_SIZE - 240);
            ponds.push({ x: px, y: py, r: 45 + Math.random() * 15 });
        }
    }

    function spawnPopUp(text, color, x, y) { popups.push({ text: text, color: color, x: x, y: y, life: 45, vy: -1.2 }); }

    function getFishDrop() {
        let roll = Math.random();
        if (roll < 0.005) return 'timmahsGold';
        if (roll < 0.035) return 'dolphinTail';
        if (roll < 0.135) return 'sharkTeeth';
        if (roll < 0.415) return 'fishScales';
        return 'seaweed';
    }

    window.addEventListener('keydown', function(e) {
        if (document.activeElement === chatInput) return;
        if (e.key === 'Enter') { chatInput.focus(); return; }

        keys[e.key.toLowerCase()] = true; keys[e.code] = true; 
        
        if (inMenu) {
            let ui = menuType === 'shop' ? ['btn-sell','btn-upgrade'] : ['craft-rod','craft-speed','craft-luck','craft-hitbox','craft-timmah'];
            let exitBtn = menuType === 'shop' ? 'btn-exit' : 'craft-exit';
            let num = parseInt(e.key);
            if (num > 0 && num <= ui.length) document.getElementById(ui[num-1]).click();
            if (e.key.toLowerCase() === 'e' || e.key === 'Escape') document.getElementById(exitBtn).click();
            return; 
        }

        if (e.key.toLowerCase() === 'e') {
            if (Math.hypot(merchant.x+20 - (player.x+20), merchant.y+20 - (player.y+20)) < 80) {
                inMenu = true; menuType = 'shop'; shopDiv.style.display = 'block'; updateUIs();
            } else if (Math.hypot(craftingTable.x+20 - (player.x+20), craftingTable.y+20 - (player.y+20)) < 80) {
                inMenu = true; menuType = 'crafting'; craftDiv.style.display = 'block'; updateUIs();
            }
        }
    });

    window.addEventListener('keyup', function(e) { 
        keys[e.key.toLowerCase()] = false; keys[e.code] = false; 
    });

    function updateUIs() {
        document.getElementById('btn-upgrade').innerText = `Upgrade Axe Damage (${player.axe_level * 50} Plat) [2]`;
        document.getElementById('craft-rod').innerText = `Upgrade Rod Speed (Lvl ${player.rod_level}) [1] - 10 Seaweed (Have: ${player.fishLoot.seaweed||0})`;
        document.getElementById('craft-speed').innerText = `Swift Boots (+Speed) [2] - 8 Fish Scales (Have: ${player.fishLoot.fishScales||0})`;
        document.getElementById('craft-luck').innerText = `Shark Luck Charm (+Tree Luck) [3] - 5 Shark Teeth (Have: ${player.fishLoot.sharkTeeth||0})`;
        document.getElementById('craft-hitbox').innerText = `Dolphin Ring (+Multi-Chop) [4] - 3 Dolphin Tails (Have: ${player.fishLoot.dolphinTail||0})`;
        document.getElementById('craft-timmah').innerText = `Timmah's Blessing (+ALL STATS) [5] - 1 Timmah Gold (Have: ${player.fishLoot.timmahsGold||0})`;
    }

    document.getElementById('btn-sell').onclick = function() {
        let earned = 0;
        for (let t in player.inventory) { earned += (player.inventory[t]||0) * TREE_TYPES[t].val; player.inventory[t] = 0; }
        player.platinum += earned; saveGame();
    };
    document.getElementById('btn-upgrade').onclick = function() {
        if (player.platinum >= player.axe_level * 50) {
            player.platinum -= player.axe_level * 50; player.axe_level++; player.axe_damage++; updateUIs(); saveGame();
        }
    };
    const exitShop = function() { inMenu = false; menuType = null; shopDiv.style.display = 'none'; craftDiv.style.display = 'none'; };
    document.getElementById('btn-exit').onclick = exitShop; document.getElementById('craft-exit').onclick = exitShop;

    document.getElementById('craft-rod').onclick = function() {
        if (player.fishLoot.seaweed >= 10) { player.fishLoot.seaweed -= 10; player.rod_level++; spawnPopUp("Rod Speed Upgraded!", "#2ecc71", player.x, player.y-40); updateUIs(); saveGame(); }
    };
    document.getElementById('craft-speed').onclick = function() {
        if (player.fishLoot.fishScales >= 8) { player.fishLoot.fishScales -= 8; player.speed += 1.2; spawnPopUp("Speed Increased!", "#3498db", player.x, player.y-40); updateUIs(); saveGame(); }
    };
    document.getElementById('craft-luck').onclick = function() {
        if (player.fishLoot.sharkTeeth >= 5) { player.fishLoot.sharkTeeth -= 5; player.axe_luck += 1.0; spawnPopUp("Tree Luck Boosted!", "#95a5a6", player.x, player.y-40); updateUIs(); saveGame(); }
    };
    document.getElementById('craft-hitbox').onclick = function() {
        if (player.fishLoot.dolphinTail >= 3) { player.fishLoot.dolphinTail -= 3; player.axe_range += 40; player.axe_multi = true; spawnPopUp("Multi-Chop Unlocked!", "#9b59b6", player.x, player.y-40); updateUIs(); saveGame(); }
    };
    document.getElementById('craft-timmah').onclick = function() {
        if (player.fishLoot.timmahsGold >= 1) { 
            player.fishLoot.timmahsGold--; player.speed += 1.5; player.axe_damage += 2; player.rod_level += 2; player.axe_luck += 2.0; player.axe_range += 30; player.axe_multi = true; 
            spawnPopUp("TIMMAH'S BLESSING ACTIVATED!", "#f1c40f", player.x, player.y-40); updateUIs(); saveGame(); 
        }
    };

    function update(dt) {
        if (!inMenu) {
            let dx = 0, dy = 0;
            if (keys['w']||keys['arrowup']) { dy -= player.speed; player.facing = 'up'; }
            if (keys['s']||keys['arrowdown']) { dy += player.speed; player.facing = 'down'; }
            if (keys['a']||keys['arrowleft']) { dx -= player.speed; player.facing = 'left'; }
            if (keys['d']||keys['arrowright']) { dx += player.speed; player.facing = 'right'; }
            if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
            player.x += dx; player.y += dy;

            let cx = Math.floor(player.x/CHUNK_SIZE), cy = Math.floor(player.y/CHUNK_SIZE);
            for(let x=cx-1; x<=cx+1; x++) for(let y=cy-1; y<=cy+1; y++) generateChunk(x,y);
        }

        let isSpace = keys['Space'] || keys['space'];
        let pCenter = {x: player.x+20, y: player.y+20};
        
        let matchedTrees = [];
        for (let t of trees) {
            if (Math.hypot(pCenter.x - (t.x+40), pCenter.y - (t.y+40)) < player.axe_range) {
                matchedTrees.push(t); if(!player.axe_multi) break;
            }
        }
        let nearbyPond = ponds.find(p => Math.hypot(pCenter.x - p.x, pCenter.y - p.y) < p.r + 45);

        if (isSpace && nearbyPond && matchedTrees.length===0 && !inMenu) {
            player.choppingTarget = null;
            if (player.fishingTarget !== nearbyPond) { player.fishingTarget = nearbyPond; player.fishProgress = 0; }
            player.fishProgress += dt;
            if (Math.random() < 0.3) particles.push({ x: nearbyPond.x+(Math.random()-0.5)*nearbyPond.r, y: nearbyPond.y+(Math.random()-0.5)*nearbyPond.r, vx: (Math.random()-0.5)*1, vy: (Math.random()-0.5)*1, life: 20, color: 'rgba(255,255,255,0.6)' });
            
            if (player.fishProgress >= 6000 / player.rod_level) {
                let loot = getFishDrop(); player.fishLoot[loot] = (player.fishLoot[loot]||0) + 1;
                spawnPopUp(`Caught: ${FISH_TYPES[loot].name}!`, FISH_TYPES[loot].color, player.x, player.y-30);
                player.fishingTarget = null; player.fishProgress = 0;
            }
        } else if (isSpace && matchedTrees.length>0 && !inMenu) {
            player.fishingTarget = null;
            let target = matchedTrees[0];
            if (player.choppingTarget !== target) { player.choppingTarget = target; player.chopProgress = 0; }
            player.chopProgress += dt;
            
            if (Math.random()<0.35) {
                matchedTrees.forEach(t => {
                    for(let i=0;i<3;i++) particles.push({ x: t.x+40, y: t.y+40, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:18, color: TREE_TYPES[t.type].trunk });
                });
            }

            if (player.chopProgress >= 10000 / player.axe_damage) {
                matchedTrees.forEach(targetTree => {
                    let idx = trees.indexOf(targetTree);
                    if (idx > -1) {
                        respawnQueue.push({x: targetTree.x, y: targetTree.y, time: Date.now()});
                        let baseDrop = Math.floor(Math.random() * 4) + 2;
                        let bonusDrop = Math.floor(player.axe_luck);
                        if (Math.random() < (player.axe_luck % 1)) bonusDrop++;
                        
                        player.inventory[targetTree.type] = (player.inventory[targetTree.type]||0) + baseDrop + bonusDrop;
                        trees.splice(idx, 1);
                    }
                });
                player.choppingTarget = null; player.chopProgress = 0;
            }
        } else {
            player.fishingTarget = null; player.fishProgress = 0;
            player.choppingTarget = null; player.chopProgress = 0;
        }

        for (let i = particles.length-1; i>=0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = popups.length-1; i>=0; i--) {
            popups[i].y += popups[i].vy; popups[i].life--;
            if (popups[i].life <= 0) popups.splice(i, 1);
        }
        
        let now = Date.now();
        for (let i = respawnQueue.length-1; i>=0; i--) {
            if (now - respawnQueue[i].time >= 25000) {
                trees.push({ type: getRandomTreeType(), x: respawnQueue[i].x, y: respawnQueue[i].y });
                respawnQueue.splice(i, 1);
            }
        }
    }

    function drawModel(x, y, facing, color) {
        ctx.fillStyle = '#1b365d'; ctx.fillRect(x+10, y+30, 8, 10); ctx.fillRect(x+22, y+30, 8, 10);
        ctx.fillStyle = color || '#b02323'; ctx.fillRect(x+8, y+16, 24, 14);
        ctx.fillStyle = '#6b1111'; ctx.fillRect(x+12, y+16, 4, 14); ctx.fillRect(x+20, y+16, 4, 14);
        ctx.fillStyle = '#f5c6a5'; ctx.fillRect(x+12, y+2, 16, 14);
        
        ctx.fillStyle = '#3a2212';
        if (facing === 'up') { ctx.fillRect(x+12, y+2, 16, 14); } 
        else {
            ctx.fillRect(x+12, y+2, 16, 4);
            if (facing === 'down') { ctx.fillStyle='black'; ctx.fillRect(x+15, y+7, 3,3); ctx.fillRect(x+22, y+7, 3,3); }
            else if (facing === 'left') { ctx.fillStyle='black'; ctx.fillRect(x+14, y+7, 3,3); }
            else if (facing === 'right') { ctx.fillStyle='black'; ctx.fillRect(x+23, y+7, 3,3); }
        }
    }

    function draw() {
        let camX = Math.floor(WIDTH/2 - player.x - 20), camY = Math.floor(HEIGHT/2 - player.y - 20);

        ctx.fillStyle = grassPattern || '#3b5e2b'; ctx.save();
        ctx.translate(camX % 64, camY % 64); ctx.fillRect(-64, -64, WIDTH+128, HEIGHT+128); ctx.restore();

        ctx.save(); ctx.translate(camX, camY);

        // Ponds
        ponds.forEach(function(p) {
            if (Math.abs(p.x - player.x) > WIDTH || Math.abs(p.y - player.y) > HEIGHT) return;
            ctx.fillStyle = '#2c4c1e'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r+6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#2980b9'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(p.x-8, p.y-8, p.r*0.5, 0, Math.PI*2); ctx.fill();
        });

        // Merchant
        ctx.fillStyle='#781d1d'; ctx.fillRect(merchant.x-20, merchant.y-10, 80, 60);
        ctx.fillStyle='#f1c40f'; ctx.fillRect(merchant.x-20, merchant.y-10, 80, 4); ctx.fillRect(merchant.x-20, merchant.y+46, 80, 4);
        drawModel(merchant.x-4, merchant.y-10, 'down', '#e74c3c'); 
        
        // Crafting
        ctx.fillStyle='#5c3a21'; ctx.fillRect(craftingTable.x-10, craftingTable.y-5, 60, 50);
        ctx.fillStyle='#2ecc71'; ctx.fillRect(craftingTable.x-12, craftingTable.y-8, 64, 12);

        let time = Date.now();
        
        // Trees
        trees.forEach(function(t) {
            if (Math.abs(t.x - player.x) > WIDTH || Math.abs(t.y - player.y) > HEIGHT) return;
            let sway = Math.sin(time/350 + t.x) * 4;
            let tData = TREE_TYPES[t.type] || TREE_TYPES.oak;
            
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(t.x+40, t.y+75, 32, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = tData.trunk; ctx.fillRect(t.x+28, t.y+35, 24, 45);
            let leaf = t.type === 'majestic' ? `hsl(${Math.floor((time/10+t.x)%360)}, 85%, 55%)` : tData.color;
            ctx.fillStyle = leaf;

            if (t.type === 'pine') {
                ctx.beginPath(); ctx.moveTo(t.x+40+sway, t.y-15); ctx.lineTo(t.x+5, t.y+30); ctx.lineTo(t.x+75, t.y+30); ctx.fill();
                ctx.beginPath(); ctx.moveTo(t.x+40+sway, t.y+10); ctx.lineTo(t.x+10, t.y+50); ctx.lineTo(t.x+70, t.y+50); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(t.x+40+sway, t.y+10, 38, 0, Math.PI*2); ctx.arc(t.x+15+sway, t.y+30, 30, 0, Math.PI*2); ctx.arc(t.x+65+sway, t.y+30, 30, 0, Math.PI*2); ctx.fill();
            }
        });

        // Player Model
        drawModel(player.x, player.y, player.facing, '#b02323');
        ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 11px Arial'; ctx.textAlign='center'; 
        ctx.fillText(myId + " (You)", player.x+20, player.y-6);

        // Tool Visuals
        if (player.fishingTarget) {
            ctx.strokeStyle = '#d2b48c'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(player.x+20, player.y+20); ctx.lineTo(player.fishingTarget.x, player.fishingTarget.y); ctx.stroke();
        } else {
            let ox = (player.facing === 'right' || player.facing === 'down') ? 28 : 2;
            ctx.fillStyle = '#5c4033'; ctx.fillRect(player.x+ox, player.y+18, 4, 16);
            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(player.x+ox-2, player.y+16, 8, 8);
        }

        // Progress Bars
        if (player.choppingTarget || player.fishingTarget) {
            let req = player.choppingTarget ? (10000 / player.axe_damage) : (6000 / player.rod_level);
            let prog = player.choppingTarget ? player.chopProgress : player.fishProgress;
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(player.x-10, player.y-18, 60, 10);
            ctx.fillStyle = player.choppingTarget ? '#2ecc71' : '#3498db';
            ctx.fillRect(player.x-8, player.y-16, 56 * Math.min(1, prog/req), 6);
        }

        particles.forEach(function(p) { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
        popups.forEach(function(p) { ctx.fillStyle = p.color; ctx.font = 'bold 14px Arial'; ctx.textAlign='center'; ctx.fillText(p.text, p.x+20, p.y); });
        
        ctx.restore();

        // HUD Panel
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(10, 10, 240, 250);
        ctx.strokeStyle = '#daa520'; ctx.strokeRect(10, 10, 240, 250);
        ctx.textAlign = 'left';
        
        ctx.fillStyle = '#daa520'; ctx.font = 'bold 14px Arial'; ctx.fillText(`💎 Platinum: ${player.platinum}`, 20, 30);
        ctx.fillStyle = '#e67e22'; ctx.font = 'bold 12px Arial'; ctx.fillText(`--- TIMBER ---`, 20, 50);
        ctx.fillStyle = '#fff'; ctx.font = '11px Arial';
        ctx.fillText(`🪵 Oak: ${player.inventory.oak||0} | 🤍 Birch: ${player.inventory.birch||0}`, 20, 68);
        ctx.fillText(`🌲 Pine: ${player.inventory.pine||0} | ⭐ Golden: ${player.inventory.golden||0}`, 20, 84);
        ctx.fillStyle = `hsl(${Math.floor((time/10)%360)}, 100%, 70%)`; ctx.fillText(`🌈 Majestic: ${player.inventory.majestic||0}`, 20, 100);

        ctx.fillStyle = '#3498db'; ctx.font = 'bold 12px Arial'; ctx.fillText(`--- FISHING TREASURES ---`, 20, 122);
        ctx.fillStyle = '#2ecc71'; ctx.font = '11px Arial'; ctx.fillText(`🌿 Seaweed: ${player.fishLoot.seaweed||0}`, 20, 140);
        ctx.fillStyle = '#3498db'; ctx.fillText(`🐟 Fish Scales: ${player.fishLoot.fishScales||0}`, 20, 156);
        ctx.fillStyle = '#95a5a6'; ctx.fillText(`🦈 Shark Teeth: ${player.fishLoot.sharkTeeth||0}`, 20, 172);
        ctx.fillStyle = '#9b59b6'; ctx.fillText(`🐬 Dolphin Tail: ${player.fishLoot.dolphinTail||0}`, 20, 188);
        ctx.fillStyle = '#f1c40f'; ctx.fillText(`👑 Timmah's Gold: ${player.fishLoot.timmahsGold||0}`, 20, 204);

        ctx.fillStyle = '#fff'; ctx.fillText(`🪓 Axe Dmg: ${player.axe_damage} | 🎣 Rod Lvl: ${player.rod_level}`, 20, 230);
        ctx.fillText(`⚡ Speed: ${player.speed.toFixed(1)} | 🌲 Tree Luck: +${(player.axe_luck*100).toFixed(0)}% Yield`, 20, 246);
    }

    let lastTime = Date.now();
    function gameLoop() {
        requestAnimationFrame(gameLoop);
        let now = Date.now(); let dt = now - lastTime; lastTime = now;
        try { update(dt); draw(); } catch(e) {}
    }
    gameLoop();
});
</script>
</body>
</html>
